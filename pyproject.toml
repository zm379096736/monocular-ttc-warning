[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monocular-ttc-warning"
version = "0.1.0"
description = "Frozen vision upstream and interpretable temporal fusion for monocular TTC estimation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "zm379096736"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "PyYAML>=6,<7",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "tqdm>=4.66,<5",
  "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

